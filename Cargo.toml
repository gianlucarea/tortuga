[package]
name = "tortuga"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# CLI args
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
